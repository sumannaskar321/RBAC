info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/v1/user/register
  body:
    type: json
    data: |-
      {
        "name": "Suman",
        "email": "Suman@gmail.com",
        "password": "1234"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
